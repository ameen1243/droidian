      - name: Droidian Kernel Patching & Build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error"
          
          # 1. إصلاح خطأ سامسونج برمجياً (تعطيل الـ Debug المسبب للخطأ)
          sed -i 's/current->x = x;/ \/\/ current->x = x;/g' include/linux/sec_debug_complete_hint.h
          sed -i 's/current->x = 0;/ \/\/ current->x = 0;/g' include/linux/sec_debug_complete_hint.h
          
          # 2. تنظيف وتجهيز الإعدادات
          make clean
          # سنستخدم أمر البحث لنجد أي ملف ينتهي بـ _defconfig ونختاره آلياً
          CONF_FILE=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1 | xargs basename)
          echo "Selected Config: $CONF_FILE"
          make $CONF_FILE
          
          # 3. تطبيق تعليمات الـ Porting Guide
          scripts/config --enable CONFIG_NAMESPACES
          scripts/config --enable CONFIG_CGROUPS
          scripts/config --enable CONFIG_LXC_BRIDGE
          scripts/config --enable CONFIG_APPMARMOR
          scripts/config --disable CONFIG_SECURITY_SELINUX 
          scripts/config --enable CONFIG_ANDROID_BINDER_IPC
          
          # 4. طبخ الكيرنل
          make KCFLAGS="$KCFLAGS" -j$(nproc)
          
