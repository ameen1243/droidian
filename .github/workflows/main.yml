      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu mkbootimg \
          python3 python-is-python3 libncurses-dev lz4 zip cpio # أضفنا أدوات الضغط

      - name: Build Kernel
        run: |
          chmod +x build_kernel.sh
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p out # نضمن وجود مجلد المخرجات
          ./build_kernel.sh
          
